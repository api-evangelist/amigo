server:
  name: amigo-platform
  description: >-
    Workspace-scoped Model Context Protocol server built into the Amigo Platform
    API. Exposes world-model read tools to MCP clients and partner agents.
    Authenticated with a workspace-scoped API key plus a workspace header.
  transport: http
  auth: API key (Bearer) + workspace header
  docs: https://docs.amigo.ai/developer-guide/platform-api/functions/mcp-server.md
notes: >-
  Amigo also documents a Data-MCP surface that provides SQL query access to
  workspace data over the Model Context Protocol (API key + workspace header),
  distinct from the REST Platform API. Tool names are not published verbatim in
  the discovery surface; this entry records the official server without
  fabricating a tool list.
