    UpsertRequest:
      properties:
        name:
          $ref: '#/components/schemas/StrippedNonemptyString_a-z___a-z0-9_______'
          description: The name of the variable to upsert.
        value:
          type: string
          maxLength: 255
          minLength: 1
          title: Value
          description: The value of the variable to upsert.
        is_secret:
          type: boolean
          title: Is Secret
          description: Whether the variable is a secret.
      type: object
      required:
      - name
      - value
      - is_secret
      title: UpsertRequest
    Preferences-Output:
      properties:
        enable_response_recommendation:
          type: boolean
          title: Enable Response Recommendation
          description: Whether to automatically recommend responses to the user if the user hasn't replied to the coach for a while.
          default: false
        preferred_language:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferred Language
          description: 'The preferred language to use for the user. This field must be in the ISO 639-3 format. The agent will attempt to converse

            with the user in this language. If not set, the agent''s default spoken language is used.'
        conversations_visible_to_admins:
          type: boolean
          title: Conversations Visible To Admins
          description: Whether the user's conversations are visible to the admins.
          default: true
        user_model_visible_to_admins:
          type: boolean
          title: User Model Visible To Admins
          description: Whether the user's user model is visible to the admins.
          default: true
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: The user's timezone in the IANA tz database format for all users in this organization. If not specified, UTC is used.
        audio_keyterms:
          items:
            type: string
          type: array
          title: Audio Keyterms
          description: A list of keyterms that are easy to get wrong during audio transcriptions that tend to occur commonly in audio sessions for this user.
          default: []
      type: object
      title: Preferences
      description: Preferences that the user can set to customize their experience.
  securitySchemes:
    Bearer-Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amigo issued JWT token that identifies an user. It's issued either after logging in through the frontend, or manually through the [`SignInWithAPIKey`](sign-in-with-api-key) endpoint.
    Bearer-Authorization-Organization:
      type: apiKey
      in: header
      name: X-ORG-ID
      description: An optional organization identifier that indicates from which organization the token is issued. This is used in rare cases where the user to authenticate is making a request for resources in another organization.
    Basic:
      type: http
      scheme: basic
      description: The username should be set to {org_id}_{user_id}, and the password should be the Amigo issued JWT token that identifies the user.
