          title: Session Id
        trace_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Trace Id
      type: object
      required:
      - source_type
      - key
      - verdict
      title: EvaluationResultView
      description: 'One check as the console renders it, derived from a single eval result.


        Both metric and assertion verdicts normalize to this shape so the frontend

        renders a check without knowing where the value was stored.'
    DestroySessionResponse:
      properties:
        status:
          type: string
          const: destroyed
          title: Status
          description: Session destruction status
      type: object
      required:
      - status
      title: DestroySessionResponse
  securitySchemes:
    Bearer-Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amigo issued JWT token that identifies an user. It's issued either after logging in through the frontend, or manually through the [`SignInWithAPIKey`](sign-in-with-api-key) endpoint.
    Bearer-Authorization-Organization:
      type: apiKey
      in: header
      name: X-ORG-ID
      description: An optional organization identifier that indicates from which organization the token is issued. This is used in rare cases where the user to authenticate is making a request for resources in another organization.
    Basic:
      type: http
      scheme: basic
      description: The username should be set to {org_id}_{user_id}, and the password should be the Amigo issued JWT token that identifies the user.
