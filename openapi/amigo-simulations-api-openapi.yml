          type: string
          format: uuid
          title: Workspace Id
        name:
          type: string
          maxLength: 128
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
        case_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Case Ids
        required_tags:
          items:
