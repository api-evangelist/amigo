      - workspace_id
      - name
      - case_count
      title: SimulationSuiteResponse
      description: HTTP response shape for first-class simulation suites.
    SimCaseAssertionResponse:
      properties:
        eval_key:
          type: string
          maxLength: 128
          title: Eval Key
        eval_type:
          type: string
          enum:
          - assertion
          - metric
          title: Eval Type
        passed:
          type: integer
          title: Passed
          default: 0
        failed:
          type: integer
          title: Failed
          default: 0
        pending:
          type: integer
          title: Pending
          default: 0
        pass_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Pass Rate
        results:
          items:
