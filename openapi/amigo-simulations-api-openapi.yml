      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
components:
  schemas:
    RunSimulationBenchmarkRequest:
      properties:
        suite_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Suite Id
        required_tags:
          items:
            type: string
            maxLength: 128
          type: array
          maxItems: 20
          title: Required Tags
        service_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Service Id
        entity_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Entity Id
          description: Optional world entity UUID to bind caller context for every selected saved-case run. When omitted, each case falls back to fixtures.case_specific.entity_id if present.
        max_cases:
          type: integer
          maximum: 200.0
          minimum: 1.0
          title: Max Cases
          default: 20
        max_turns:
          type: integer
          maximum: 40.0
          minimum: 1.0
          title: Max Turns
          default: 20
        concurrency:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Concurrency
          default: 1
        branch_name:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Branch Name
        tags:
          items:
            type: string
            maxLength: 128
          type: array
          maxItems: 20
          title: Tags
        exploration:
          anyOf:
          - $ref: '#/components/schemas/ExplorationConfig'
          - type: 'null'
      type: object
      title: RunSimulationBenchmarkRequest
    ListSimulationSuitesResponse:
      properties:
        suites:
          items:
            $ref: '#/components/schemas/SimulationSuiteResponse'
          type: array
          title: Suites
      type: object
      required:
      - suites
      title: ListSimulationSuitesResponse
    GetSimulationBenchmarkResultsRequest:
      properties:
        run_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 100
          minItems: 1
          title: Run Ids
      type: object
      required:
      - run_ids
      title: GetSimulationBenchmarkResultsRequest
    ConfigToPolicyRequest:
      properties:
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
      - config
      title: ConfigToPolicyRequest
    SimSuitePerfResponse:
      properties:
        suite_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Suite Id
        suite_name:
          type: string
          maxLength: 512
          title: Suite Name
        pass_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Pass Rate
        passed:
          type: integer
          title: Passed
          default: 0
        measured:
          type: integer
          title: Measured
          default: 0
        latest_run_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Run At
        cases:
          items:
            $ref: '#/components/schemas/SimCasePerfResponse'
          type: array
          title: Cases
      type: object
      required:
      - suite_name
      title: SimSuitePerfResponse
    SimulationEvalResultResponse:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
        run_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Run Id
        case_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Case Id
        session_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Session Id
        eval_key:
          type: string
          maxLength: 128
          title: Eval Key
        eval_type:
          type: string
          enum:
          - assertion
          - metric
          title: Eval Type
        assertion_kind:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Assertion Kind
        metric_key:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Metric Key
        status:
          type: string
          enum:
          - passed
          - failed
          - pending
          - skipped
          - error
          title: Status
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        expected:
          anyOf:
          - {}
          - type: 'null'
          title: Expected
        actual:
          anyOf:
          - {}
          - type: 'null'
          title: Actual
        rationale:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Rationale
        justification:
          anyOf:
          - type: string
            maxLength: 8000
          - type: 'null'
          title: Justification
        references:
          items:
            type: integer
          type: array
          maxItems: 100
          title: References
        details:
          additionalProperties: true
          type: object
          title: Details
        definition:
          additionalProperties: true
          type: object
          title: Definition
        created_at:
          anyOf:
