            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/patients:
    get:
      tags:
      - FHIR
      summary: Search patients
      description: Search patient entities by name, MRN, or phone.
      operationId: fhir-patient-search
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name, MRN, phone, or entity ID
          title: Q
        description: Search by name, MRN, phone, or entity ID
      - name: mrn
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by MRN
          title: Mrn
        description: Search by MRN
      - name: phone
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by phone
          title: Phone
        description: Search by phone
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort field with +/- prefix (e.g. -last_event_at)
          title: Sort By
        description: Sort field with +/- prefix (e.g. -last_event_at)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
