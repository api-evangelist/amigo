      - name: facility_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Facility ID
          title: Facility Id
        description: Facility ID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
