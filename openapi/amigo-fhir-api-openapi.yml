          - type: 'null'
          description: Scope to data source
          title: Data Source Id
        description: Scope to data source
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirAppointmentListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/views/slots:
    get:
      tags:
      - FHIR
      summary: List availability slots
      description: Frontend-ready provider availability slot list with start, end, status, schedule reference, and provider display name. Optionally scoped to a data source.
      operationId: fhir-slots-view
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search
          title: Q
        description: Search
      - name: data_source_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Scope to data source
          title: Data Source Id
        description: Scope to data source
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Slot status (e.g. 'free', 'busy')
          title: Status
        description: Slot status (e.g. 'free', 'busy')
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start date YYYY-MM-DD (filters slots on or after this date)
          title: Date
        description: Start date YYYY-MM-DD (filters slots on or after this date)
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 1
          description: Number of days forward from date (default 7)
          default: 7
          title: Days
        description: Number of days forward from date (default 7)
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Provider name (partial match, e.g. 'Woloski')
          title: Provider
        description: Provider name (partial match, e.g. 'Woloski')
      - name: specialty
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Specialty (partial match, e.g. 'Psychiatry')
          title: Specialty
        description: Specialty (partial match, e.g. 'Psychiatry')
      - name: service_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Visit/service type name (partial match, e.g. 'Follow-up')
          title: Service Type
