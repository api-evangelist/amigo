  /v1/{workspace_id}/fhir/resources/{resource_type}:
    get:
      tags:
      - FHIR
      summary: Search FHIR resources
      description: Search FHIR resources by type with standard search parameters.
      operationId: fhir-search-resources
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: resource_type
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Resource Type
      - name: _count
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: ' Count'
      - name: _offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: ' Offset'
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Name
      - name: identifier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Identifier
      - name: birthdate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Birthdate
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Date
      - name: patient
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Patient
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Status
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          description: General search text
          title: Q
        description: General search text
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirSearchResponse'
        '400':
          description: Invalid resource type.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - FHIR
      summary: Create a FHIR resource
      description: Create a new FHIR resource. Automatically creates patient entities.
      operationId: fhir-create-resource
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: resource_type
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Resource Type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FhirWriteRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirResourceResponse'
        '400':
          description: Invalid resource type or payload.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/resources/{resource_type}/{resource_id}/history:
    get:
      tags:
      - FHIR
      summary: Get FHIR resource history
      description: Fetch the version history and changed-field provenance for a FHIR resource.
      operationId: fhir-get-resource-history
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: resource_type
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Resource Type
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
          title: Resource Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirResourceHistoryResponse'
        '400':
          description: Invalid resource type.
        '404':
          description: Resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/resources/{resource_type}/{resource_id}:
    get:
      tags:
      - FHIR
      summary: Get a FHIR resource
      description: Fetch a single FHIR resource by type and ID.
      operationId: fhir-get-resource
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: resource_type
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Resource Type
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirResourceResponse'
        '400':
