openapi: 3.1.0
info:
  title: Amigo Account FHIR API
  version: 0.1.0
servers:
- url: https://api.amigo.ai
- url: https://internal-api.amigo.ai
- url: https://api-eu-central-1.amigo.ai
- url: https://api-ap-southeast-2.amigo.ai
- url: https://api-ca-central-1.amigo.ai
security:
- Bearer-Authorization: []
  Bearer-Authorization-Organization: []
  Basic: []
tags:
- name: FHIR
paths:
  /v1/{workspace_id}/fhir/status:
    get:
      tags:
      - FHIR
      summary: Get clinical data status
      description: Get event and entity counts for the workspace's clinical data.
      operationId: fhir-status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirStatusResponse'
        '404':
          description: Workspace not found.
        '401':
          description: Missing or invalid API key.
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
  /v1/{workspace_id}/fhir/import:
    post:
      tags:
      - FHIR
      summary: Import FHIR Bundle
      description: Import a FHIR Bundle. Decomposes supported resources into upserted world events and creates patient entities. Unsupported resource types are skipped and reported; omitted resources are not deleted.
      operationId: fhir-import
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FhirImportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirImportResponse'
        '400':
          description: Invalid bundle format.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
  /v1/{workspace_id}/fhir/import-stream:
    post:
      tags:
      - FHIR
      summary: Import FHIR resources via NDJSON streaming
      description: 'Stream FHIR resources as NDJSON (one resource per line). Bypasses the buffered-body size cap on /fhir/import. Callers MUST pre-resolve any bundle-internal urn:uuid: references. Unsupported resource types are skipped and reported; omitted resources are not deleted.'
      operationId: fhir-import-stream
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: source
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
          default: fhir_import
          title: Source
      - name: source_system
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Source System
      - name: data_source_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Data Source Id
      - name: dedup
        in: query
        required: false
        schema:
          type: boolean
          description: Skip identical re-uploads via content-hash dedup
          default: true
          title: Dedup
        description: Skip identical re-uploads via content-hash dedup
      - name: unsupported_resource_policy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FhirUnsupportedResourcePolicy'
          description: Use 'error' to report unsupported resources, or 'skip' to skip them without errors.
          default: error
        description: Use 'error' to report unsupported resources, or 'skip' to skip them without errors.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirImportResponse'
        '400':
          description: Stream exceeded line cap.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/views/patients:
    get:
      tags:
      - FHIR
      summary: List patients (clinical view)
      description: Frontend-ready patient list with flattened demographics, conditions, medications, allergies, and insurance. Optionally scoped to a specific data source via data_source_id.
      operationId: fhir-patients-view
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name
          title: Q
        description: Search by name
      - name: data_source_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Scope to data source
          title: Data Source Id
        description: Scope to data source
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirPatientListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/views/practitioners:
    get:
      tags:
      - FHIR
      summary: List practitioners
      description: Frontend-ready practitioner list with name, NPI, specialty, phone. Optionally scoped to a data source.
      operationId: fhir-practitioners-view
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name
          title: Q
        description: Search by name
      - name: data_source_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Scope to data source
          title: Data Source Id
        description: Scope to data source
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirPractitionerListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/views/locations:
    get:
      tags:
      - FHIR
      summary: List locations
      description: Frontend-ready location list with name, address, phone, hours. Optionally scoped to a data source.
      operationId: fhir-locations-view
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name
          title: Q
        description: Search by name
      - name: data_source_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Scope to data source
          title: Data Source Id
        description: Scope to data source
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FhirLocationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{workspace_id}/fhir/views/appointments:
    get:
      tags:
      - FHIR
      summary: List appointments
      description: Frontend-ready appointment list with date, status, patient, practitioner, location, reason. Optionally scoped to a data source.
      operationId: fhir-appointments-view
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search
          title: Q
        description: Search
      - name: data_source_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
