      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
          title: Resource Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FhirWriteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
