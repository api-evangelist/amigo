        must be PHI-safe (the engine reports column + type + counts only — never cell

        values). ``curated_path``/``cdc_path`` are set only on a clean verdict.'
    NameString:
      type: string
      maxLength: 256
      minLength: 1
    SlugString:
      type: string
      maxLength: 63
      minLength: 2
      pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
    RegisterSchemaRequest:
