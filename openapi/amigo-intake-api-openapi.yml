          description: 'Document only — the SET of accepted file types (V265, e.g.

            ``["pdf","docx","md"]``). Empty → single-type (just ``file_type``).

            ``file_type`` is included as the primary. Mixing in a tabular type

            (csv/xls/xlsx) is rejected; snapshot datasets are single-type.'
          default: []
        primary_key:
          items:
            $ref: '#/components/schemas/_FieldName'
          type: array
          maxItems: 32
          title: Primary Key
          description: Snapshot only — the canonical PK column(s). Empty/ignored for documents.
          default: []
        schema:
          items:
            $ref: '#/components/schemas/SchemaFieldSpec'
          type: array
          maxItems: 500
          title: Schema
          description: Snapshot only — canonical field list ``[{name, type}]`` (wire key ``schema``).
          default: []
        document_processing:
