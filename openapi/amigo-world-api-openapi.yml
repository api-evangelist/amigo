    EntityResolveRequest:
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityTypeString'
          description: Required entity type filter (e.g. 'person'). Narrows the scan to the right index.
        phone:
          anyOf:
          - $ref: '#/components/schemas/PhoneE164'
          - type: 'null'
          description: E.164 phone number.
        email:
          anyOf:
          - type: string
            format: email
