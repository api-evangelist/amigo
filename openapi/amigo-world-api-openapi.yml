  /v1/{workspace_id}/world/entities/{entity_id}/merged:
    get:
      tags:
      - World
      summary: Get merged entities (same_as links)
      description: Returns entities linked via same_as edges — historical merge edges where different data sources refer to the same real-world entity (written by the pre-SDP resolver; merge detection now lives in the Databricks pipeline — new edges are not produced).
      operationId: merged-entities
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
