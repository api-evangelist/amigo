        source_system:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Source System
          description: Subsystem / connector identifier.
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Write confidence. Must be >= registry min_confidence for the key.
          default: 1.0
        effective_at:
