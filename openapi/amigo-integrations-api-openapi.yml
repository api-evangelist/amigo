      - header_name
      title: StaticHeaderAuthDict
      description: 'Static workspace-level secret used verbatim as a single header value.


        Replaces legacy ``api_key_header`` and ``bearer_token`` — bearer is just

        ``header_name="Authorization"`` with the SSM secret holding ``"Bearer <token>"``.'
    CustomTokenExchangeAuthDict:
      properties:
        type:
          type: string
          const: custom_token_exchange
          title: Type
        exchange_url:
          type: string
          title: Exchange Url
        body_encoding:
          type: string
          enum:
          - json
          - form
          title: Body Encoding
        static_headers:
          additionalProperties:
            type: string
          type: object
          title: Static Headers
        static_body_fields:
          additionalProperties:
            type: string
          type: object
          title: Static Body Fields
        param_headers:
          additionalProperties:
            $ref: '#/components/schemas/ParamValueDict'
          type: object
          title: Param Headers
        param_body_fields:
          additionalProperties:
            $ref: '#/components/schemas/ParamValueDict'
          type: object
          title: Param Body Fields
        response_token_path:
          type: string
          title: Response Token Path
        identity_bindings:
          additionalProperties:
            type: string
          type: object
          title: Identity Bindings
        identity_binding_test_values:
          additionalProperties:
            type: string
          type: object
          title: Identity Binding Test Values
      type: object
      required:
      - type
      - exchange_url
      - body_encoding
      - static_headers
      - static_body_fields
      - param_headers
      - param_body_fields
      - response_token_path
      - identity_bindings
      title: CustomTokenExchangeAuthDict
      description: 'Pre-flight exchange that mints a downstream bearer.


        Replaces legacy ``json_token_exchange`` AND ``bearer_token_exchange``.

        Downstream call always receives ``Authorization: Bearer {token}``. No

        in-process caching — every call mints fresh.'
    OAuth2JwtBearerAuthRequest:
      properties:
        type:
          type: string
          const: oauth2_jwt_bearer
          title: Type
          default: oauth2_jwt_bearer
        token_url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Token Url
        assertion_issuer:
          type: string
          title: Assertion Issuer
          description: RFC 7523 ``iss`` claim — typically the service-account email or client_id.
        assertion_audience:
          type: string
          title: Assertion Audience
          description: RFC 7523 ``aud`` claim — typically the token_url.
        assertion_subject:
          type: string
          title: Assertion Subject
          description: 'RFC 7523 § 3 ``sub`` claim — MUST be present. For service-account flows

            where the client is its own subject, set to the same value as ``assertion_issuer``.

            Use a different value only for delegation / impersonation grants.'
        assertion_lifetime_seconds:
          type: integer
          title: Assertion Lifetime Seconds
          default: 3600
        include_iat:
          type: boolean
          title: Include Iat
          description: 'RFC 7523 § 3 item 6 — ``iat`` claim set to mint time. Most IdPs (Google, Azure)

            require it for anti-replay; leave True unless a specific vendor rejects it.'
          default: true
        include_jti:
          type: boolean
          title: Include Jti
          description: When True, generate a fresh ``jti`` (anti-replay) on every mint.
          default: true
        assertion_algorithm:
          type: string
          enum:
          - RS256
          - RS384
          - RS512
          - PS256
          - PS384
          - PS512
          - ES256
          - ES384
          - ES512
          title: Assertion Algorithm
          default: RS256
        assertion_usage:
          type: string
          enum:
          - authorization_grant
          - client_authentication
          title: Assertion Usage
          description: 'RFC 7523 flow selector — required; the caller must pick a flow.

            ``authorization_grant`` (§ 2.1) sends the JWT as ``assertion`` under

            ``grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer``.

            ``client_authentication`` (§ 2.2, the ``private_key_jwt`` method) sends it as

            ``client_assertion`` + ``client_assertion_type`` under ``grant_type=client_credentials``

            — required by Epic / SMART Backend Services.'
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
          description: 'RFC 7523 § 2.1 ``scope`` form-body parameter. Vendors that put scopes inside

            the JWT instead (Google service accounts) use ``extra_claims = {"scope": "..."}``

            and leave this empty.'
        extra_claims:
          additionalProperties: true
          type: object
          title: Extra Claims
          description: 'RFC 7523 § 3 item 8 — arbitrary additional JWT claims (e.g. Google''s

            ``scope`` claim, Azure''s tenant claim). Merged BEFORE the required claims so

            IdP-specific extensions can''t override ``iss`` / ``sub`` / ``aud`` / ``exp`` /

            ``iat`` / ``nbf`` / ``jti``.'
          default: {}
      type: object
      required:
      - token_url
      - assertion_issuer
      - assertion_audience
      - assertion_subject
      - assertion_usage
      title: OAuth2JwtBearerAuthRequest
      description: 'OAuth 2.0 JWT Bearer Token — RFC 7523.


        ``assertion_usage`` (required) selects the flow: § 2.1 (JWT as authorization

        grant) or § 2.2 (JWT as client authentication / private_key_jwt).'
    IntegrationRejectRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Reason
      type: object
      title: IntegrationRejectRequest
      description: Reject body — optional free-text reason surfaced to the agent.
  securitySchemes:
    Bearer-Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amigo issued JWT token that identifies an user. It's issued either after logging in through the frontend, or manually through the [`SignInWithAPIKey`](sign-in-with-api-key) endpoint.
    Bearer-Authorization-Organization:
      type: apiKey
      in: header
      name: X-ORG-ID
      description: An optional organization identifier that indicates from which organization the token is issued. This is used in rare cases where the user to authenticate is making a request for resources in another organization.
    Basic:
      type: http
      scheme: basic
      description: The username should be set to {org_id}_{user_id}, and the password should be the Amigo issued JWT token that identifies the user.
