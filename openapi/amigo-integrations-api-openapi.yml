          type: string
          title: Token Url
        assertion_issuer:
          type: string
          title: Assertion Issuer
        assertion_audience:
          type: string
          title: Assertion Audience
        assertion_subject:
          type: string
          title: Assertion Subject
        assertion_lifetime_seconds:
          type: integer
          title: Assertion Lifetime Seconds
        include_iat:
          type: boolean
          title: Include Iat
        include_jti:
          type: boolean
          title: Include Jti
        assertion_algorithm:
          type: string
          enum:
          - RS256
          - RS384
          - RS512
          - PS256
          - PS384
          - PS512
          - ES256
          - ES384
          - ES512
          title: Assertion Algorithm
        assertion_usage:
          type: string
          enum:
          - authorization_grant
          - client_authentication
          title: Assertion Usage
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
        extra_claims:
          additionalProperties: true
          type: object
          title: Extra Claims
      type: object
      required:
      - type
      - token_url
      - assertion_issuer
      - assertion_audience
      - assertion_subject
      - assertion_lifetime_seconds
      - include_iat
      - include_jti
      - assertion_algorithm
      - assertion_usage
      - scopes
      - extra_claims
      title: OAuth2JwtBearerAuthDict
      description: 'OAuth 2.0 JWT Bearer Token — RFC 7523.


        ``assertion_usage`` selects the flow: § 2.1 (JWT as authorization grant) or

        § 2.2 (JWT as client authentication / private_key_jwt).'
    NameString:
      type: string
      maxLength: 256
      minLength: 1
    StaticHeaderAuthDict:
      properties:
        type:
          type: string
          const: static_header
          title: Type
        header_name:
          type: string
          title: Header Name
      type: object
      required:
