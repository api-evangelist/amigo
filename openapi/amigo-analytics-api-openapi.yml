      type: object
      required:
      - agent_id
      - agent_name
      - total_calls
      - completed_calls
      - avg_duration_seconds
      - completion_rate
      title: AgentAnalyticsEntry
    CallStatsResponse:
      properties:
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: Workspace identifier
        period_start:
          type: string
          format: date
          title: Period Start
          description: Start of the reporting period
        period_end:
          type: string
          format: date
          title: Period End
          description: End of the reporting period
        total_calls:
          type: integer
          title: Total Calls
          description: Total number of calls in the period
        total_duration_seconds:
          type: number
          title: Total Duration Seconds
          description: Sum of all call durations in seconds
        avg_duration_seconds:
          type: number
          title: Avg Duration Seconds
          description: Average call duration in seconds
        calls_by_date:
          items:
            $ref: '#/components/schemas/DailyCallStat'
          type: array
          title: Calls By Date
          description: Daily call volume breakdown
      type: object
      required:
      - workspace_id
      - period_start
      - period_end
      - total_calls
      - total_duration_seconds
      - avg_duration_seconds
      - calls_by_date
      title: CallStatsResponse
    DataQualityResponse:
      properties:
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: Workspace identifier
        period_start:
          type: string
          format: date
          title: Period Start
          description: Start of the reporting period
        period_end:
          type: string
          format: date
          title: Period End
          description: End of the reporting period
        confidence_distribution:
          items:
            $ref: '#/components/schemas/ConfidenceBucket'
          type: array
          title: Confidence Distribution
          description: Overall confidence distribution across buckets
        confidence_by_source:
          additionalProperties:
            items:
              $ref: '#/components/schemas/ConfidenceBucket'
            type: array
          type: object
          title: Confidence By Source
          description: Confidence distribution broken down by event source
        review_pipeline:
          additionalProperties: true
          type: object
          title: Review Pipeline
          description: Review pipeline throughput statistics
        timeseries:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Timeseries
          description: Daily confidence averages and event counts
        total_events:
          type: integer
          title: Total Events
          description: Total number of events in the period
      type: object
      required:
      - workspace_id
      - period_start
      - period_end
      - confidence_distribution
      - confidence_by_source
      - review_pipeline
      - timeseries
      - total_events
      title: DataQualityResponse
      description: Data quality metrics — confidence distribution, review pipeline stats.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    EvalQualityTrendPoint:
      properties:
        date:
          type: string
          format: date
          title: Date
          description: Date bucket (granularity follows `interval`)
        total_evals:
          type: integer
          title: Total Evals
          description: Total verdicts in this bucket
        judged:
          type: integer
          title: Judged
          description: Verdicts with a non-null pass/fail outcome in this bucket
        pass_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Pass Rate
          description: Fraction of judged verdicts that passed in this bucket
        avg_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Score
          description: Mean numeric judge score in this bucket
      type: object
      required:
      - date
      - total_evals
      - judged
      title: EvalQualityTrendPoint
      description: Single date-bucket data point in the eval-quality trend series.
    CallQualityTrendPoint:
      properties:
        date:
          type: string
          title: Date
          description: Time bucket as an ISO-8601 timestamp string (granularity follows `interval`)
        avg_quality:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Quality
          description: Average quality score in this bucket (0-100)
        call_count:
          type: integer
          title: Call Count
          description: Number of calls in this bucket
        escalation_count:
          type: integer
          title: Escalation Count
          description: Number of escalated calls in this bucket
      type: object
      required:
      - date
      - call_count
      - escalation_count
      title: CallQualityTrendPoint
      description: Single time-bucket data point in the call-quality trend series.
    CallQualityAnalyticsResponse:
      properties:
        summary:
          $ref: '#/components/schemas/CallQualitySummary'
          description: Aggregate call-quality metrics for the period
        trend:
          items:
            $ref: '#/components/schemas/CallQualityTrendPoint'
          type: array
          maxItems: 2200
          title: Trend
          description: Time series of call-quality metrics per interval bucket
        quality_distribution:
          $ref: '#/components/schemas/CallQualityDistribution'
          description: Call counts bucketed by quality-score band
      type: object
      required:
      - summary
      - trend
      - quality_distribution
      title: CallQualityAnalyticsResponse
      description: 'Call quality score trends, distribution, and summary over time.


        Served from the live Delta projection ``analytics.source_call_intelligence``.'
    UsageSummaryResponse:
      properties:
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: Workspace identifier
        period_start:
          type: string
          format: date
          title: Period Start
          description: Start of the reporting period
        period_end:
          type: string
          format: date
          title: Period End
          description: End of the reporting period
        buckets:
          items:
            $ref: '#/components/schemas/UsageBucket'
          type: array
          title: Buckets
          description: Usage data grouped by event type and date
        total_events:
          type: integer
          title: Total Events
          description: Total number of events in the period
      type: object
      required:
      - workspace_id
      - period_start
      - period_end
      - buckets
      - total_events
      title: UsageSummaryResponse
    UsageBucket:
      properties:
        event_type:
          type: string
          title: Event Type
          description: World event type
        event_date:
          type: string
          format: date
          title: Event Date
          description: Date of the usage bucket
        count:
          type: integer
          title: Count
          description: Number of events in this bucket
        avg_duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Duration Seconds
          description: Average event duration in seconds
        total_duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Duration Seconds
          description: Total event duration in seconds
      type: object
      required:
      - event_type
      - event_date
      - count
      title: UsageBucket
    AnalyticsDashboardResponse:
      properties:
        call_volume:
          $ref: '#/components/schemas/AnalyticsKpi'
          description: Total calls in the period
        avg_quality:
          $ref: '#/components/schemas/AnalyticsKpi'
          description: Average quality score (0-100); higher is better
        avg_ttfb_ms:
          $ref: '#/components/schemas/AnalyticsKpi'
          description: Average audio time-to-first-byte in ms; lower is better
        escalation_rate:
          $ref: '#/components/schemas/AnalyticsKpi'
          description: Fraction of calls escalated; lower is better
        tool_success_rate:
          $ref: '#/components/schemas/AnalyticsKpi'
          description: Fraction of tool calls that succeeded; higher is better
        avg_duration_s:
          $ref: '#/components/schemas/AnalyticsKpi'
          description: Average call duration in seconds
        period_days:
          type: integer
          title: Period Days
          description: Length of the reporting period in days
      type: object
      required:
      - call_volume
      - avg_quality
      - avg_ttfb_ms
      - escalation_rate
      - tool_success_rate
      - avg_duration_s
      - period_days
      title: AnalyticsDashboardResponse
      description: 'Composite dashboard — six headline KPIs, each with a delta, plus the period length.


        Higher-is-better for ``call_volume``, ``avg_quality``, ``tool_success_rate``;

        higher-is-worse for ``escalation_rate``, ``avg_ttfb_ms``, ``avg_duration_s``.

        Consumers must color deltas by that per-KPI polarity, not by delta sign alone.'
    CallQualitySummary:
      properties:
        avg_quality_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Quality Score
          description: Mean quality score across calls (0-100)
        p50_quality_score:
          anyOf:
          - type: number
          - type: 'null'
          title: P50 Quality Score
          description: Median quality score (0-100)
        p95_quality_score:
          anyOf:
          - type: number
          - type: 'null'
          title: P95 Quality Score
          description: 95th-percentile quality score (0-100)
        total_calls:
          type: integer
          title: Total Calls
          description: Total number of calls in the period
        escalation_rate:
          type: number
          title: Escalation Rate
          description: Fraction of calls escalated to an operator (0.0-1.0)
        avg_duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Duration Seconds
          description: Average call duration in seconds
      type: object
      required:
      - total_calls
      - escalation_rate
      title: CallQualitySummary
      description: Aggregate call-quality stats for the period.
    EvalQualitySummary:
      properties:
        eval_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Eval Key
          description: Eval key for a per-key row; null for the overall summary
        total_evals:
          type: integer
          title: Total Evals
          description: Total verdicts recorded (any status, incl. errored)
        judged:
          type: integer
          title: Judged
          description: Verdicts with a non-null pass/fail outcome (denominator for pass_rate)
        pass_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Pass Rate
          description: Fraction of judged verdicts that passed (0.0-1.0)
        avg_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Score
          description: Mean numeric judge score across scored verdicts
      type: object
      required:
      - total_evals
      - judged
      title: EvalQualitySummary
      description: 'Aggregate production-eval verdict stats, overall or for one eval_key.


        Sourced from ``call_eval_results`` (LLM-judge + assertion verdicts), which is

        keyed by ``conversation_id`` and therefore CHANNEL-AGNOSTIC — voice, text,

        SMS, email all contribute equally, unlike the voice-shaped call-quality score.'
    AgentAnalyticsResponse:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentAnalyticsEntry'
          type: array
          title: Agents
        period:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
      type: object
      required:
      - agents
      title: AgentAnalyticsResponse
    OperatorPerformanceSummary:
      properties:
        total_calls:
          type: integer
          title: Total Calls
          description: Total number of calls in the period
        escalated_count:
          type: integer
          title: Escalated Count
          description: Number of calls escalated to an operator
        escalation_rate:
          type: number
          title: Escalation Rate
          description: Fraction of calls that were escalated (0.0-1.0)
        operator_handled_count:
          type: integer
          title: Operator Handled Count
          description: Number of calls where an operator was active
        avg_escalated_duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Escalated Duration Seconds
          description: Average duration in seconds of escalated calls
        avg_escalated_quality_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Escalated Quality Score
          description: Average quality score of escalated calls
        avg_non_escalated_quality_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Non Escalated Quality Score
          description: Average quality score of non-escalated calls
      type: object
      required:
      - total_calls
      - escalated_count
      - escalation_rate
      - operator_handled_count
      title: OperatorPerformanceSummary
      description: Aggregate operator escalation stats for the period.
    EventBreakdownItem:
      properties:
        key:
          type: string
          title: Key
          description: Grouping key (event type or source name)
        count:
          type: integer
          title: Count
          description: Number of events for this key
      type: object
      required:
      - key
      - count
      title: EventBreakdownItem
      description: Single row in an event breakdown aggregation.
    AnalyticsKpi:
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Current-period value (None when no data)
        delta_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Delta Pct
          description: Percent change vs the previous period, or None
      type: object
      title: AnalyticsKpi
      description: 'A single headline KPI with its period-over-period change.


        ``value`` is left broad (int for counts, float for rates/scores/durations,

        ``None`` when the metric has no data for the period). ``delta_pct`` is the

        signed percent change vs the previous equal-length period, or ``None`` when

        a prior-period comparison is unavailable.'
  securitySchemes:
    Bearer-Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amigo issued JWT token that identifies an user. It's issued either after logging in through the frontend, or manually through the [`SignInWithAPIKey`](sign-in-with-api-key) endpoint.
    Bearer-Authorization-Organization:
      type: apiKey
      in: header
      name: X-ORG-ID
      description: An optional organization identifier that indicates from which organization the token is issued. This is used in rare cases where the user to authenticate is making a request for resources in another organization.
    Basic:
      type: http
      scheme: basic
      description: The username should be set to {org_id}_{user_id}, and the password should be the Amigo issued JWT token that identifies the user.
