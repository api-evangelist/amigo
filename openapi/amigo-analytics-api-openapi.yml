      type: object
      required:
      - confidence_range
      - count
      title: ConfidenceBucket
    OperatorPerformanceResponse:
      properties:
        summary:
          $ref: '#/components/schemas/OperatorPerformanceSummary'
          description: Aggregate operator performance metrics
        trend:
          items:
            $ref: '#/components/schemas/OperatorPerformanceTrendPoint'
          type: array
          maxItems: 2200
          title: Trend
          description: Time series of escalation counts per interval bucket
      type: object
      required:
      - summary
      - trend
      title: OperatorPerformanceResponse
      description: Operator escalation performance and quality comparison over time.
    EventBreakdownResponse:
      properties:
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: Workspace identifier
        period_start:
          type: string
          format: date
          title: Period Start
          description: Start of the reporting period
        period_end:
          type: string
          format: date
          title: Period End
          description: End of the reporting period
        by_type:
          items:
            $ref: '#/components/schemas/EventBreakdownItem'
          type: array
          title: By Type
          description: Event counts grouped by event type
        by_source:
          items:
            $ref: '#/components/schemas/EventBreakdownItem'
          type: array
          title: By Source
          description: Event counts grouped by source
        total_events:
          type: integer
          title: Total Events
          description: Total number of events in the period
      type: object
      required:
