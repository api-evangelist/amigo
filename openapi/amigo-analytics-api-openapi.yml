      - period_start
      - period_end
      - by_type
      - by_source
      - total_events
      title: EventBreakdownResponse
    EvalQualityResponse:
      properties:
        summary:
          $ref: '#/components/schemas/EvalQualitySummary'
          description: Workspace-wide aggregate for the period
        by_eval_key:
          items:
            $ref: '#/components/schemas/EvalQualitySummary'
          type: array
          maxItems: 200
          title: By Eval Key
          description: Per-eval-key aggregates, most-evaluated first
        trend:
          items:
            $ref: '#/components/schemas/EvalQualityTrendPoint'
          type: array
          maxItems: 2200
          title: Trend
          description: Time series of eval pass-rate/score per interval bucket
      type: object
      required:
      - summary
      - by_eval_key
      - trend
      title: EvalQualityResponse
      description: 'Production-eval quality: overall pass-rate/score, per-eval-key breakdown, and a trend.


        The channel-agnostic quality surface. Returns zeroed shapes (empty ``by_eval_key``

        and ``trend``, null rates) when no verdicts exist for the workspace/window — the

        console renders an empty-state rather than erroring, so this ships safely ahead of

        the eager-eval trigger being enabled in production.'
    CallQualityDistribution:
      properties:
        excellent_90_100:
          type: integer
          title: Excellent 90 100
          description: Calls with quality score 90-100
        good_70_89:
          type: integer
          title: Good 70 89
          description: Calls with quality score 70-89
        fair_50_69:
          type: integer
          title: Fair 50 69
          description: Calls with quality score 50-69
        poor_0_49:
          type: integer
          title: Poor 0 49
          description: Calls with quality score 0-49
      type: object
      required:
      - excellent_90_100
      - good_70_89
      - fair_50_69
      - poor_0_49
      title: CallQualityDistribution
      description: Call counts bucketed by quality-score band.
    AgentAnalyticsEntry:
      properties:
