          format: uuid
          title: Agent Id
        agent_name:
          type: string
          title: Agent Name
        total_calls:
          type: integer
          title: Total Calls
        completed_calls:
          type: integer
          title: Completed Calls
        avg_duration_seconds:
          type: number
          title: Avg Duration Seconds
        completion_rate:
          type: number
