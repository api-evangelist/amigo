overlay: 1.0.0
info:
  title: API Evangelist enhancements for Amigo Classic API
  version: 1.0.0
extends: openapi/amigo-classic-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: amigo
      x-apievangelist-api: amigo-classic
      x-apievangelist-artifacts:
        authentication: authentication/amigo-authentication.yml
        conventions: conventions/amigo-conventions.yml
        errors: errors/amigo-problem-types.yml
        webhooks: asyncapi/amigo-classic-webhooks.yml
        packages: packages/amigo-packages.yml
      x-apievangelist-notes: >-
        Organization-scoped JWT bearer auth; text-first digital-health agent API.
        Regional base URLs (US/EU/APAC/CA). Webhooks with HMAC verification.
