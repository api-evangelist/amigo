overlay: 1.0.0
info:
  title: API Evangelist enhancements for Amigo Platform API
  version: 1.0.0
extends: openapi/amigo-platform-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: amigo
      x-apievangelist-api: amigo-platform
      x-apievangelist-artifacts:
        authentication: authentication/amigo-authentication.yml
        scopes: scopes/amigo-scopes.yml
        conventions: conventions/amigo-conventions.yml
        errors: errors/amigo-problem-types.yml
        mcp: mcp/amigo-mcp.yml
        data_model: data-model/amigo-data-model.yml
      x-apievangelist-notes: >-
        Workspace-scoped API key (Bearer) plus OAuth2 client_credentials (53
        scopes). Built-in workspace-scoped MCP server. Voice + healthcare
        operations, FHIR/EHR surface, immutable agent versioning.
