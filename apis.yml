aid: amigo
name: Amigo
description: >-
  Amigo is a healthcare AI platform for building, training, and deploying clinical
  agents across voice and text channels. Built on an event-sourced data foundation
  that unifies messy healthcare data, it pairs a multi-channel reasoning engine with
  EHR/FHIR connectors, operator workflows, and a simulation-first "Digital Residency"
  training model. Amigo ships two public REST APIs — the Classic API (organization-scoped
  JWT, text-first digital-health apps) and the Platform API (workspace-scoped API keys
  and OAuth2, enterprise voice and healthcare operations) — plus official Python and
  TypeScript SDKs, the Agent Forge CLI, webhooks, and a workspace-scoped MCP server.
  Enterprise security is SOC 2 Type II, HIPAA, HITRUST, and GDPR aligned with multi-region
  data residency. Amigo is a General Catalyst AI portfolio company.
