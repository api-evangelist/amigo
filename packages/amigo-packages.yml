generated: '2026-07-17'
method: searched
source: https://docs.amigo.ai/developer-guide/classic-api/sdks.md
notes: >-
  First-party Amigo client libraries. The Classic API ships official Python and
  TypeScript SDKs; the Platform API ships an official TypeScript SDK. The Agent
  Forge CLI ("forge") is distributed as a self-contained Go binary via an
  install script (its command surface is catalogued in cli/amigo-cli.yml).
packages:
  - language: python
    registry: pypi
    name: amigo_sdk
    url: https://pypi.org/project/amigo_sdk/
    install: pip install amigo_sdk
    official: true
    api: amigo-classic
    docs: https://docs.amigo.ai/developer-guide/classic-api/sdks/sdk-installation.md
  - language: javascript
    registry: npm
    name: "@amigo-ai/sdk"
    url: https://www.npmjs.com/package/@amigo-ai/sdk
    install: npm install @amigo-ai/sdk@1.0.0
    official: true
    api: amigo-classic
    notes: Pin version 1.0.0 — 1.1.x on npm are deprecated and not releases of this SDK.
    docs: https://docs.amigo.ai/developer-guide/classic-api/sdks/sdk-installation.md
  - language: javascript
    registry: npm
    name: "@amigo-ai/platform-sdk"
    url: https://www.npmjs.com/package/@amigo-ai/platform-sdk
    install: npm install @amigo-ai/platform-sdk
    official: true
    api: amigo-platform
    notes: Ships ESM and CJS builds with full TypeScript type declarations.
    docs: https://docs.amigo.ai/developer-guide/platform-api/platform-sdk/installation.md
  - language: go
    registry: install-script
    name: agent-forge (forge)
    url: https://forge.platform.amigo.ai/install.sh
    install: curl -fsSL https://forge.platform.amigo.ai/install.sh | sh
    official: true
    api: amigo-platform
    notes: CLI binary; command surface documented in cli/amigo-cli.yml.
    docs: https://docs.amigo.ai/reference/agent-forge.md
